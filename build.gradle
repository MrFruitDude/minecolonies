tableau {
    project {
        group = "com.ldtteam"
        publisher = "LDTTeam"
        modId = "minecolonies"
    }

    maven {
        publishAsLDTTeamMod()
        publishLocally()
        pom({
            usingGnu3License()
            usingGit()
        })
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xmaxerrs', '5000', '-Xmaxwarns', '5000'])
}

// The migrated API docs contain legacy HTML/entities and stale references that
// are warnings under the MC 26.2 toolchain but otherwise block packaging.
tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-Xdoclint:none')
}

// NeoGradle 7.1.x (Tableau pins 7.1.37; checked up to 7.1.39) does not pass
// NeoForm's `--no-dist-annotations` to its preProcessJar step, so the MC 26.x
// decompile keeps @OnlyIn on nested types and the NeoForm/UserDev patches fail
// (9 rejected hunks). 7.1.38+ only fixes this on the userdev setup path, not
// the NeoForm runtime used here. Strip those annotations from the decompiled
// sources before patching. Remove when Tableau moves off NeoGradle 7.1.
tasks.matching { it.name == 'neoFormPatch' }.configureEach { patchTask ->
    doFirst {
        def decompileJar = project.tasks.getByName('neoFormDecompile').outputs.files.files
                .find { it.name == 'outputs.jar' }
        if (decompileJar == null || !decompileJar.exists()) {
            throw new GradleException("neoFormPatch @OnlyIn fix: decompile output not found (${decompileJar})")
        }

        def nestedOnlyIn = /(?m)^( +)@OnlyIn\s*\([^)]*\)\n(\1(?:public |private |protected )?(?:static |final |abstract )?(?:class |interface |record |enum |@interface ))/
        def collapsedNested = /(?m)^(\}+)\n( +(?:public|private|protected)\s+(?:static\s+)?(?:class |interface |enum ))/

        def workDir = new File(project.buildDir, "onlyin-fix")
        workDir.deleteDir()
        workDir.mkdirs()
        int changed = 0
        project.zipTree(decompileJar).matching { include '**/*.java' }.visit { details ->
            if (details.directory) return
            def text = details.file.getText('UTF-8')
            if (!text.contains('@OnlyIn')) return
            def fixed = text.replaceAll(nestedOnlyIn, '$2').replaceAll(collapsedNested, '$1\n\n$2')
            if (fixed == text) return
            def dest = new File(workDir, details.path)
            dest.parentFile.mkdirs()
            dest.setText(fixed, 'UTF-8')
            changed++
        }
        if (changed > 0) {
            ant.jar(destfile: decompileJar.absolutePath, basedir: workDir, update: true)
        }
        logger.lifecycle("neoFormPatch @OnlyIn fix: rewrote ${changed} decompiled sources")
        workDir.deleteDir()
    }
}

// MC 26.3: NeoForge's AT widens the anonymous HolderSet$1.contents() to public,
// but NeoGradle 7.1.x's source transformer cannot address anonymous classes, so
// the recompile fails ("attempting to assign weaker access privileges").
// Apply that single AT line to the transformed source before recompiling.
tasks.matching { it.name == 'neoFormRecompile' }.configureEach {
    doFirst {
        def holderSet = project.file("build/neoForm/neoFormJoined26.3-1/steps/transformSource/transformed/net/minecraft/core/HolderSet.java")
        if (!holderSet.exists()) return
        def text = holderSet.text
        def fixed = text.replaceFirst(
            /(return new HolderSet\.Named<T>\(owner, key\) \{\s*@Override\s*)protected (List<Holder<T>> contents\(\))/,
            '$1public $2')
        if (fixed != text) holderSet.text = fixed
    }
}

// Port 26.3: the 1.21 build expanded the ${...} placeholders in neoforge.mods.toml
// through OperaPublicaCreator's mod.gradle. Tableau does not, so the jars shipped them
// literally: FML then skipped every version check and printed messages like
// "requires structurize ${structurize_version} or above". Fill them from
// gradle.properties here; FML itself resolves ${file.jarVersion} from the manifest.
tasks.named('processResources', ProcessResources).configure {
    def modsTomlValues = ['fml_range', 'neoforge_range', 'minecraft_range', 'structurizeRange', 'blockUiRange', 'domumOrnamentumRange', 'multiPistonRange', 'jeiRange', 'journeymapRange', 'dynamicTreesRange'].collectEntries { [(it): project.property(it).toString()] }
    inputs.properties(modsTomlValues)
    filesMatching('META-INF/neoforge.mods.toml') {
        filter { String line ->
            modsTomlValues.each { k, v -> line = line.replace('${' + k + '}', v) }
            def unresolved = line =~ /\$\{(?!file\.jarVersion\})[^}]*\}/
            if (unresolved.find()) {
                throw new GradleException("Unresolved neoforge.mods.toml placeholder ${unresolved.group()} in: ${line.trim()}")
            }
            line
        }
    }
}

// The port's GameTests (com.minecolonies.core.gametest, ~370 KB of classes plus the
// colony_plot test structure) live in the main source set so runGameTestServer picks
// them up, but they must not ship. Dev runs use the class/resource dirs, not this jar.
// MineColonies#<init> only touches the registrar when GameTests are enabled, so the
// shipped jar never links it.
tasks.named('jar', Jar).configure {
    exclude 'com/minecolonies/core/gametest/**'
    exclude 'data/minecolonies/structure/gametest/**'
}
